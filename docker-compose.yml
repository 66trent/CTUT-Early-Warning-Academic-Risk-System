# CTUT-EWARS — môi trường chạy bằng Docker (docs/rules/01-architecture.md)
#   docker compose --profile dev up -d --build   # đủ 6 service (có MailHog)
#   docker compose up -d postgres redis minio     # chỉ hạ tầng, chạy app bằng `npm run dev`
# Biến môi trường đọc từ .env; hostname bên trong mạng Docker được ghi đè ở `environment`.

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio
  MINIO_PORT: '9000'
  SMTP_HOST: mailhog
  SMTP_PORT: '1025'
  # Đồng bộ Moodle (Phase 10): trong mạng Docker gọi thẳng service `moodle` (ở máy dùng localhost:8080 trong .env).
  MOODLE_BASE_URL: http://moodle

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      PROCESS_ROLE: web
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      PROCESS_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Lưu file CSV gốc của mỗi lần nhập (ImportBatch.originalFilePath)
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data

  # Hộp thư giả để xem email khi phát triển: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    profiles: ['dev']
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  # ── Moodle 5.3 demo (Phase 10a — docs/tich-hop-moodle.md) ─────────────────────────
  # Giả lập Moodle của trường để thử đồng bộ: `npm run moodle:up` → http://localhost:8080
  # DB riêng (không dùng chung DB EWARS); cổng chỉ mở 127.0.0.1.
  moodle-db:
    image: postgres:17-alpine
    profiles: ['moodle']
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:-}
      POSTGRES_DB: moodle
    volumes:
      - moodle_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moodle -d moodle']
      interval: 5s
      timeout: 5s
      retries: 10

  moodle:
    build:
      context: ./integrations/moodle/docker
    profiles: ['moodle']
    restart: unless-stopped
    environment:
      MOODLE_DB_HOST: moodle-db
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:-}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-}
      # Mật khẩu chung tài khoản giảng viên / sinh viên demo (script ewars_seed_demo.php).
      MOODLE_DEMO_PASSWORD: ${MOODLE_DEMO_PASSWORD:-}
      MOODLE_WWWROOT: http://localhost:8080
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - moodle_data:/var/www/moodledata
      - ./integrations/moodle/cli:/var/www/html/ewars-cli:ro
      - ./docs/demo-data/moodle:/var/www/html/ewars-demo:ro
    depends_on:
      moodle-db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  moodle_db_data:
  moodle_data:
